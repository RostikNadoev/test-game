services:
  postgres:
    image: postgres:16-alpine
    container_name: twingames_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tg_lobbies}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tg_lobbies}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: twingames_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      GIN_MODE: ${GIN_MODE:-release}
      APP_ENV: ${APP_ENV:-docker}
      DATABASE_DSN: host=postgres user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-postgres} dbname=${POSTGRES_DB:-tg_lobbies} port=5432 sslmode=disable TimeZone=UTC
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-168}
      ALLOW_DEV_AUTH: ${ALLOW_DEV_AUTH:-false}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost}
      ADMIN_ENABLED: ${ADMIN_ENABLED:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-}
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:-http://localhost:8081}
    networks:
      - app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: twingames_frontend
    restart: unless-stopped
    networks:
      - app

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: /
    container_name: twingames_admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8081}:80"
    networks:
      - app

  tgbot:
    build:
      context: ./tgbot
      dockerfile: Dockerfile
    container_name: twingames_tgbot
    restart: unless-stopped
    environment:
      PORT: 8090
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      FRONTEND_PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
    networks:
      - app

  nginx:
    image: nginx:1.27-alpine
    container_name: twingames_nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app

networks:
  app:
    name: twingames_app

volumes:
  pgdata:
